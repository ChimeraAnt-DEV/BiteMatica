name: Build .AntEgg

# Builds the BiteMatica native mod for arm64-v8a and packages it as a `.AntEgg`,
# the GlowberryClient mod format. Runs the host test suite first: the format readers,
# the mesh projector and the toolbar geometry are all covered there, so a green build
# means the packaging step is shipping code that passed its tests.
#
# On a tag (v*) the produced `.AntEgg` is attached to a GitHub release.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # setup-android's default package list includes the legacy `tools` package,
          # which Google removed from the SDK repo in 2025; only install platform-tools.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install build tools and cmake
        run: sdkmanager "build-tools;35.0.0" "cmake;3.22.1"

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Configure NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Regenerate test fixtures
        run: python3 test/make_fixtures.py test/fixtures

      - name: Configure host tests
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build host tests
        run: cmake --build build/host --target bitematica_tests bitematica_world_tests --parallel

      - name: Run host tests (formats, mesh, UI)
        run: ./build/host/bitematica_tests

      - name: Run host tests (world space - placement, mesher, verification, translation)
        run: ./build/host/bitematica_world_tests

      - name: Check the mod loads on an older preloader (weak render symbols)
        run: |
          chmod +x test/link_check.sh
          PRELOADER_INCLUDE=third_party/preloader-android/include test/link_check.sh

      - name: Build and package .AntEgg
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify the package layout
        run: |
          set -euo pipefail
          PACKAGE="$(ls dist/*.antegg | head -1)"
          echo "Verifying $PACKAGE"
          python3 - "$PACKAGE" <<'PY'
          import json, sys, zipfile
          package = sys.argv[1]
          with zipfile.ZipFile(package) as archive:
              names = sorted(archive.namelist())
              print("\n".join(names))
              required = ["egg.json", "manifest.json", "bin/libbitematica.so",
                          "config/config.json", "config/config.schema.json"]
              for entry in required:
                  if entry not in names:
                      sys.exit("missing required entry: " + entry)
              if not any(n.startswith("schematics/") for n in names):
                  sys.exit("no schematic shipped in the package")

              # The preloader reads manifest.json at the extracted mod root and refuses
              # to load unless it is preload-native and its entry exists in the package.
              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("type") != "preload-native":
                  sys.exit("manifest.json is not type preload-native")
              if manifest.get("entry") not in names:
                  sys.exit("manifest.json entry is not in the package: "
                           + str(manifest.get("entry")))
              if manifest.get("icon") and manifest["icon"] not in names:
                  sys.exit("manifest.json icon is not in the package")
          print("package layout OK")
          PY

      - name: Verify the packaged .so is loadable (weak render symbols)
        run: |
          python3 tools/verify_antegg.py "$(ls dist/*.antegg | head -1)" \
            --require-weak pl::render::

      - name: Upload .AntEgg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiteMatica-antegg
          path: dist/*.antegg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.antegg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
